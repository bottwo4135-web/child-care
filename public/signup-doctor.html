<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Create Doctor Account — Child Care IS</title>
<link rel="stylesheet" href="./styles.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header class="app-header">
  <div class="container header-content">
    <div class="branding"><h1>Sign Up — Doctor</h1></div>
    <nav class="header-nav">
      <a class="btn link" href="./index.html">Home</a>
    </nav>
  </div>
</header>
<main class="container main-content">
  <section class="card">
    <form id="form" autocomplete="on">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email" placeholder="Enter your email" />
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="new-password" placeholder="Create a password" />
      <button class="btn primary" type="submit" id="signupBtn">Create Account</button>
    </form>
    <div id="alert" class="alert" aria-live="polite"></div>
    <div id="spinner" style="display:none;text-align:center;padding:12px"><span class="spinner"></span></div>
  </section>
</main>
<script type="module">
  import { initApp, registerUser } from './app/app.js';

  const alertEl = document.getElementById('alert');
  const spinner = document.getElementById('spinner');
  const signupBtn = document.getElementById('signupBtn');
  const setAlert = (m,t='info') => { alertEl.textContent=m; alertEl.className = `alert ${t}`; spinner.style.display='none'; signupBtn.disabled=false; };
  initApp();

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    alertEl.textContent = '';
    spinner.style.display = 'block';
    signupBtn.disabled = true;
    try {
      await registerUser(document.getElementById('email').value.trim(), document.getElementById('password').value, 'staff');
      setAlert('Doctor account created. An admin may need to adjust your role.', 'success');
    } catch (err) {
      setAlert(err.message || String(err), 'error');
    }
    spinner.style.display = 'none';
    signupBtn.disabled = false;
  });
</script>
</body></html>
